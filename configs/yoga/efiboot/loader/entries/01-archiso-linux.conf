title      Arch Linux install medium (aarch64, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/Image
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
devicetree /%INSTALL_DIR%/boot/%ARCH%/%DTB%
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% audit=0 efi=novamap,noruntime pd_ignore_unused clk_ignore_unused arm64.nopauth
